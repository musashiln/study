<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>鹈鹕骑行</title>
  <style>
    :root { color-scheme: light; --ink: #293f3e; --paper: #fff8e8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      padding: clamp(12px, 2.6vmin, 36px); display: grid; place-items: center;
      background-color: #f2ebdc;
      background-image: radial-gradient(#ad997f40 .65px, transparent .85px);
      background-size: 5px 5px; color: var(--ink);
      font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: min(100%, 1200px, calc((100svh - 116px) * 1.6667)); }
    figure {
      margin: 0; padding: clamp(7px, 1.15vw, 16px) clamp(7px, 1.15vw, 16px) 0;
      background: var(--paper); border: 1px solid #bcaf96;
      box-shadow: 0 2px 1px #6c55351a, 0 12px 35px -18px #65543e5c;
    }
    .picture { aspect-ratio: 5 / 3; overflow: hidden; border: 1px solid #938d75; background: #fae8c5; }
    #scene { display: block; width: 100%; height: 100%; stroke-linejoin: round; stroke-linecap: round; }
    figcaption { display: flex; align-items: center; justify-content: space-between; min-height: 55px; gap: 1rem; }
    .caption-title { display: flex; align-items: center; gap: 12px; }
    h1 { margin: 0; font: 600 clamp(18px, 2vw, 25px)/1.2 "Baskervville", "Songti SC", "STSong", "SimSun", serif; letter-spacing: .12em; }
    .seal { width: 32px; height: 27px; }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; min-width: 78px; padding: 0 13px; border: 1px solid transparent;
      border-radius: 24px; background: transparent; color: var(--ink); cursor: pointer;
      font: 600 14px/1 "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button:hover { background: #f2ead7; border-color: #c8baa0; }
    button:focus-visible { outline: 2px solid #286c63; outline-offset: 1px; }
    button svg { width: 16px; height: 16px; fill: currentColor; }
    [hidden] { display: none !important; }
    @media (max-width: 640px) and (orientation: portrait) {
      main { width: 100%; }
      .picture { aspect-ratio: 4 / 5; }
      .sun-in-sky { transform: translateX(-110px); }
      figcaption { min-height: 51px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      body { padding: 5px; } main { width: min(100%, calc((100svh - 54px) * 1.6667)); }
      figure { padding: 4px 4px 0; } figcaption { min-height: 36px; } button { min-height: 32px; }
    }
  </style>
</head>

        </div>

          <svg viewBox="0 0 20 20" aria-hidden="true"><path id="playback-icon" d="M5 3h3v14H5zm7 0h3v14h-3z"/></svg>
          <span id="playback-label">暂停</span>

  </main>
  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const tau = 2 * Math.PI;
      const degrees = radians => radians * 180 / Math.PI;
      const fixed = value => value.toFixed(2);
      const translate = (node, x, y) => node.setAttribute('transform', `translate(${fixed(x)} ${fixed(y)})`);
      const rotate = (node, angle) => node.setAttribute('transform', `rotate(${fixed(angle)})`);

      const crank = { x: 554, y: 530, radius: 28, period: 2.62 };
      const wheelRadius = 82;
      const gearRatio = 23 / 12;
      const parts = {
        rider: byId('rider'), rearSpokes: byId('rear-spokes'), frontSpokes: byId('front-spokes'),
        chainring: byId('chainring'), links: byId('chain-links'), eye: byId('eye'),
        ribbon: byId('wind-ribbon'), shortRibbon: byId('short-ribbon'), nearWing: byId('near-wing'),
        farWing: byId('far-wing'), gulls: byId('sky-birds'), boat: byId('boat-bob')
      };
      const legs = [
        { hipX: 531, hipY: 386, phase: Math.PI, shin: byId('far-shin'), foot: byId('far-foot'), arm: byId('far-crank') },
        { hipX: 508, hipY: 389, phase: 0, shin: byId('near-shin'), foot: byId('near-foot'), arm: byId('near-crank'), hock: byId('near-hock') }
      ];
      const landscape = [
        { node: byId('clouds'), period: 1200, speed: .004 },
        { node: byId('headlands'), period: 1200, speed: .015 },
        { node: byId('sea-marks'), period: 400, speed: .053 },
        { node: byId('boats'), period: 1200, speed: .027 },
        { node: byId('dunes'), period: 900, speed: .15 },
        { node: byId('road-marks'), period: 780, speed: 1 },
        { node: byId('verge'), period: 1120, speed: 1.13 }
      ];

      function pedalLeg(leg, angle, lift) {
        const phase = angle + leg.phase;
        const pedalX = crank.x + crank.radius * Math.cos(phase);
        const pedalY = crank.y + crank.radius * Math.sin(phase);
        const pitch = (-2 + 9 * Math.cos(phase + .3)) * Math.PI / 180;
        rotate(leg.arm, degrees(phase));
        leg.foot.setAttribute('transform', `translate(${fixed(pedalX)} ${fixed(pedalY)}) rotate(${fixed(degrees(pitch))})`);

        // 脚蹼和脚踏共用坐标系。由髋关节和踝关节反推向后弯曲的跗关节。
        const ankleX = pedalX - 16 * Math.cos(pitch) + 8 * Math.sin(pitch);
        const ankleY = pedalY - 16 * Math.sin(pitch) - 8 * Math.cos(pitch);
        const hipX = leg.hipX;
        const hipY = leg.hipY + lift;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const span = Math.hypot(dx, dy);
        const upper = 84, lower = 90;
        const along = (upper * upper - lower * lower + span * span) / (2 * span);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const hockX = hipX + (along * dx - bend * dy) / span;
        const hockY = hipY + (along * dy + bend * dx) / span;
        const beforeX = hockX + .09 * (hipX - hockX);
        const beforeY = hockY + .09 * (hipY - hockY);
        const afterX = hockX + .09 * (ankleX - hockX);
        const afterY = hockY + .09 * (ankleY - hockY);
        leg.shin.setAttribute('d', `M${fixed(hipX)} ${fixed(hipY)} L${fixed(beforeX)} ${fixed(beforeY)} Q${fixed(hockX)} ${fixed(hockY)} ${fixed(afterX)} ${fixed(afterY)} L${fixed(ankleX)} ${fixed(ankleY)}`);
        if (leg.hock) translate(leg.hock, .25 * (beforeX + 2 * hockX + afterX), .25 * (beforeY + 2 * hockY + afterY));
      }

      function holdHandlebar(wing, shoulderX, gripX, lift) {
        const shear = -lift / (gripX - shoulderX);
        wing.setAttribute('transform', `matrix(1 ${shear.toFixed(6)} 0 1 0 ${fixed(-shear * shoulderX)})`);
      }

      function flutter(seconds) {
        const wind = seconds * 3.6;
        const middle = -2 + 4 * Math.sin(wind - .6);
        const crest = -16 + 6 * Math.sin(wind - 1.6);
        const end = -17 + 8 * Math.sin(wind - 2.45);
        parts.ribbon.setAttribute('d', [
          'M0 -6', `C-21 -13 -40 ${fixed(middle + 2)} -63 ${fixed(middle - 4)}`,
          `S-110 ${fixed(crest - 9)} -143 ${fixed(end - 5)}`,
          `L-132 ${fixed(end + 2)} -144 ${fixed(end + 10)}`,
          `C-111 ${fixed(crest + 6)} -89 ${fixed(middle + 17)} -63 ${fixed(middle + 11)}`,
          'S-19 1 0 6Z'
        ].join(' '));
        rotate(parts.shortRibbon, 3.8 * Math.sin(wind - .55));
      }

      function draw(seconds) {
        const advance = tau * seconds / crank.period;
        const angle = advance - .4;
        const wheelAngle = advance * gearRatio;
        const distance = wheelAngle * wheelRadius;
        const lift = 1.45 * Math.sin(2 * angle - .4) + .7 * Math.sin(angle + .9);

        // 同一段滚动弧长同时驱动车轮和脚下的路面，远处各层按距离减速。
        rotate(parts.rearSpokes, degrees(wheelAngle) % 360);
        rotate(parts.frontSpokes, (degrees(wheelAngle) + 13) % 360);
        rotate(parts.chainring, degrees(angle) % 360);
        parts.links.setAttribute('stroke-dashoffset', fixed(-(advance * 23 % 6)));
        for (const layer of landscape) translate(layer.node, -(distance * layer.speed % layer.period), 0);
        translate(parts.boat, 0, 1.05 * Math.sin(seconds * 1.6));
        translate(parts.gulls, -12 * Math.sin(seconds * .14), 2.1 * Math.sin(seconds * .47));

        translate(parts.rider, 0, lift);
        for (const leg of legs) pedalLeg(leg, angle, lift);
        holdHandlebar(parts.nearWing, 525, 677, lift);
        holdHandlebar(parts.farWing, 577, 682, lift);
        flutter(seconds);
        const blink = (seconds + 2.3) % 4.9;
        const opening = Math.min(1, Math.max(.065, Math.abs(blink - .11) / .11));
        parts.eye.setAttribute('transform', `scale(1 ${opening.toFixed(3)})`);
      }

      const button = byId('playback');
      const label = byId('playback-label');
      const icon = byId('playback-icon');
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motion.matches;
      let elapsed = 0;
      let previous = null;
      let frameId = 0;

      function tick(timestamp) {
        if (previous !== null) elapsed += Math.min((timestamp - previous) / 1000, .08);
        previous = timestamp;
        draw(elapsed);
        frameId = requestAnimationFrame(tick);
      }
      function syncPlayback() {
        cancelAnimationFrame(frameId);
        previous = null;
        label.textContent = playing ? '暂停' : '播放';
        button.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        icon.setAttribute('d', playing ? 'M5 3h3v14H5zm7 0h3v14h-3z' : 'M5 3.3a.8.8 0 0 1 1.2-.7l10 6.6a1 1 0 0 1 0 1.6l-10 6.6a.8.8 0 0 1-1.2-.7Z');
        if (playing && !document.hidden) frameId = requestAnimationFrame(tick);
      }
      button.addEventListener('click', () => { playing = !playing; syncPlayback(); });
      document.addEventListener('visibilitychange', syncPlayback);
      motion.addEventListener('change', event => { playing = !event.matches; syncPlayback(); });
      draw(0);
      button.hidden = false;
      syncPlayback();
    })();
  </script>
