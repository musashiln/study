<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>火烈鸟骑鳄鱼 · 日落巡游</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #254f49; }
    .lagoon {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }
    .scene {
      display: block;
      flex: none;
      width: min(116vw, 190vh);
      width: min(116vw, 190svh);
      max-width: none;
      height: auto;
      overflow: visible;
      grid-area: 1 / 1;
      justify-self: center;
    }
    .motion-control {
      position: absolute;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid #ffedc17a;
      border-radius: 50%;
      background: #163f3ee6;
      color: #fff1cc;
      cursor: pointer;
    }
    .motion-control[hidden] { display: none; }
    .motion-control:hover { background: #255951; }
    .motion-control:focus-visible { outline: 3px solid #fff2c7; outline-offset: 4px; }
    .motion-control svg { width: 21px; height: 21px; fill: currentColor; }
    .play-icon, .paused .pause-icon { display: none; }
    .paused .play-icon { display: block; }

    .swimmers { animation: cruise 11s ease-in-out infinite; }
    .float { transform-origin: 602px 470px; animation: float 3.6s ease-in-out infinite; }
    .tail { transform-origin: 439px 467px; animation: sweep 3.6s ease-in-out infinite; }
    .near-paddle { transform-origin: 697px 475px; animation: stroke 3.6s ease-in-out infinite; }
    .hind-paddle { transform-origin: 436px 477px; animation: stroke 3.6s -1.8s ease-in-out infinite; }
    .rider { transform-origin: 552px 420px; animation: ride 3.6s ease-in-out infinite; }
    .neck { transform-origin: 590px 370px; animation: nod 3.6s ease-in-out infinite; }
    .wing { transform-origin: 579px 372px; animation: feathers 3.6s ease-in-out infinite; }
    .scarf { transform-origin: 628px 322px; animation: flutter 1.8s ease-in-out infinite; }
    .eyelid { transform-origin: 653px 205px; animation: blink 6.7s linear infinite; }
    .water-strokes { animation: current 8s ease-in-out infinite alternate; }
    .water-strokes.far { animation-duration: 13s; animation-direction: alternate-reverse; }
    .wake { animation: wake 3.6s ease-out infinite; }
    .wake.behind { animation-delay: -1.8s; }
    .glints { animation: glimmer 4.6s ease-in-out infinite alternate; }
    .lotus { transform-origin: 0 0; animation: lotus 4.8s ease-in-out infinite; }
    .reeds { transform-origin: 0 0; animation: breeze 6.3s ease-in-out infinite alternate; }
    .paused .scene * { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) {
      .lagoon:not(.playing) .scene * { animation-play-state: paused; }
    }
    @keyframes cruise { 0%, 100% { transform: translateX(-12px); } 50% { transform: translateX(13px); } }
    @keyframes float { 0%, 100% { transform: translateY(1px) rotate(.5deg); } 50% { transform: translateY(-4px) rotate(-.65deg); } }
    @keyframes sweep { 0%, 100% { transform: rotate(-3deg) scaleY(.94); } 50% { transform: rotate(3deg) scaleY(1.06); } }
    @keyframes stroke { 0%, 100% { transform: rotate(-10deg); } 38% { transform: rotate(12deg); } 74% { transform: rotate(-13deg); } }
    @keyframes ride { 0%, 100% { transform: rotate(-.6deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes nod { 0%, 100% { transform: rotate(1.7deg); } 48% { transform: rotate(-1.2deg); } }
    @keyframes feathers { 0%, 100% { transform: rotate(1deg); } 55% { transform: rotate(-2.5deg); } }
    @keyframes flutter { 0%, 100% { transform: skewY(-4deg) scaleX(.98); } 50% { transform: skewY(4deg) scaleX(1.04); } }
    @keyframes blink { 0%, 44%, 47%, 100% { transform: scaleY(1); } 45.5% { transform: scaleY(.08); } }
    @keyframes current { to { transform: translateX(-23px); } }
    @keyframes wake { from { opacity: 0; transform: translate(9px, -2px); } 24% { opacity: .85; } to { opacity: 0; transform: translate(-34px, 4px); } }
    @keyframes glimmer { from { opacity: .34; } to { opacity: .77; } }
    @keyframes lotus { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-3px) rotate(1deg); } }
    @keyframes breeze { from { transform: skewX(-2deg); } to { transform: skewX(2.5deg); } }
  </style>

  <script>
    const lagoon = document.querySelector('.lagoon');
    const control = document.querySelector('.motion-control');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');

    function setPaused(paused) {
      lagoon.classList.toggle('paused', paused);
      lagoon.classList.toggle('playing', !paused);
      const label = paused ? '播放动画' : '暂停动画';
      control.setAttribute('aria-label', label);
      control.title = label;
    }

    setPaused(motionPreference.matches);
    control.hidden = false;
    control.addEventListener('click', () => setPaused(!lagoon.classList.contains('paused')));
    motionPreference.addEventListener('change', event => setPaused(event.matches));
  </script>
